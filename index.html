    <!-- Security headers via meta tags -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

         sin ellos el CSP bloquea la tipografia y la app cae al font del sistema. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; connect-src 'self' https://*.base44.com wss://*.base44.com https://www.googleapis.com https://calendar.google.com https://accounts.google.com; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self';" />
  </head>

  </body>
