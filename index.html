<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>INMOBILIARE Julio Corredor</title>

    <!-- Barra de estado del navegador con el morado de marca. Se declara por
         esquema para que en oscuro no aparezca una franja clara sobre la app. -->
    <meta name="theme-color" content="#5400CF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14101F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="INMOBILIARE" />

    <!-- Security headers via meta tags.
         No se permiten origenes de fuentes externos a proposito: DM Sans va
         auto-hospedada via @fontsource y se sirve desde 'self'. Antes esta
         politica listaba fonts.googleapis.com/fonts.gstatic.com para que Inter
         cargara; al auto-hospedar, esos origenes sobran y quitarlos reduce la
         superficie del CSP y una dependencia de red de terceros. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Esta politica es la que SIEMPRE aplica, incluida la app servida desde
         base44.app, donde las cabeceras de vercel.json no existen. Cuando hay
         varias politicas el navegador exige la interseccion, asi que cualquier
         origen nuevo hay que agregarlo aqui Y en vercel.json o queda bloqueado.

         connect-src lista .app ademas de .com: el backend es
         inmobiliare.base44.app (ver .env.example). Con solo *.base44.com,
         callFunction() queda bloqueada al servir desde Vercel. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; connect-src 'self' https://*.base44.com wss://*.base44.com https://*.base44.app wss://*.base44.app https://www.googleapis.com https://calendar.google.com https://accounts.google.com; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self';" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
